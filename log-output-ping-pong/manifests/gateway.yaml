apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: log-ping-gateway
  namespace: exercises
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      kinds:
      - kind: HTTPRoute

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-ping-route
  namespace: exercises
spec:
  parentRefs:
  - name: log-ping-gateway
  rules:
  # Rule 1: /log -> port 3000
  - matches:
    - path:
        type: PathPrefix
        value: /log
    backendRefs:
    - name: log-output-svc
      port: 3000

  # Rule 2: Intercept POST / -> rewrite to /pingpong -> port 3001
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /pingpong
    backendRefs:
    - name: ping-pong-svc
      port: 3001
