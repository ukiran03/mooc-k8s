apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: log-ping-gateway
  namespace: exercises
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 8000
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
        group: gateway.networking.k8s.io

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-ping-route
  namespace: exercises
spec:
  parentRefs:
  - name: log-ping-gateway
  rules:
  # Rule 1: Specific path (/log) must come FIRST so it isn't swallowed by the catch-all
  - matches:
    - path:
        type: PathPrefix
        value: /log
    backendRefs:
    - name: log-output-svc
      port: 3000
  # Rule 2: Intercept POST requests on root (/) and rewrite to /pingpong
  - matches:
    - method: POST
      path:
        type: PathPrefix
        value: /
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /pingpong
    backendRefs:
    - name: ping-pong-svc
      port: 3001
