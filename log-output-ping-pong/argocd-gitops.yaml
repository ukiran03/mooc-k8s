apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-output-ping-pong
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ukiran03/mooc-k8s.git
    path: ./log-output-ping-pong
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
