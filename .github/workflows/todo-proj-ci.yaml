name: Todo App CI

on:
  push:
    branches: [main]
    paths:
      - 'todo-app/**'
    tags:
      - 'v*.*'
      - '*.*'
  pull_request:
    branches: [main]
    paths:
      - 'todo-app/**'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    # Automatically picks ref_name if it's a tag, otherwise falls back to sha
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          declare -A image_map=(
            ["todo-backend"]="todo-backend"
            ["todo-frontend"]="todo-frontend"
            ["broadcaster"]="todo-broadcaster"
          )
          for dir in "${!image_map[@]}"; do
            repo_name="${image_map[$dir]}"
            IMAGE_TAG="ushakiran369/$repo_name:$TAG"
            docker build --tag "$IMAGE_TAG" "./todo-app/$dir/"
            docker push "$IMAGE_TAG"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Staging Kustomization Images
        if: github.ref == 'refs/heads/main'
        working-directory: ./todo-app/staging
        run: |
          declare -A kustomize_map=(
            ["BACKEND_IMAGE"]="ushakiran369/todo-backend:$TAG"
            ["FRONTEND_IMAGE"]="ushakiran369/todo-frontend:$TAG"
            ["BROADCASTER_IMAGE"]="ushakiran369/todo-broadcaster:$TAG"
          )
          for name in "${!kustomize_map[@]}"; do
            kustomize edit set image "$name=${kustomize_map[$name]}"
          done

      - name: Update Production Kustomization Images (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./todo-app/production
        run: |
          declare -A kustomize_map=(
            ["BACKEND_IMAGE"]="ushakiran369/todo-backend:$TAG"
            ["FRONTEND_IMAGE"]="ushakiran369/todo-frontend:$TAG"
            ["BROADCASTER_IMAGE"]="ushakiran369/todo-broadcaster:$TAG"
          )
          for name in "${!kustomize_map[@]}"; do
            kustomize edit set image "$name=${kustomize_map[$name]}"
          done

      - name: Commit Staging Changes
        if: github.ref == 'refs/heads/main'
        uses: EndBug/add-and-commit@v10
        with:
          cwd: 'todo-app'
          add: 'staging/kustomization.yaml'
          message: 'Update staging images ${{ env.TAG }}'

      - name: Commit Production Kustomization Changes (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add todo-app/production/kustomization.yaml
          git commit -m "Update production images to version ${{ env.TAG }}" || echo "No changes to commit"
          git push origin main
