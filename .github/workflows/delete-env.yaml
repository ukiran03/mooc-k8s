name: Delete Environment

on:
  delete:

jobs:
  delete-environment:
    runs-on: ubuntu-latest

    # Only run when a branch is deleted, and protect the 'main' branch/environment
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Authenticate with Google Cloud (matches your main deployment workflow)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Delete Kubernetes Namespace
        run: |
          NAMESPACE="${{ github.event.ref }}"
          echo "Deleting environment namespace: $NAMESPACE"
          kubectl delete namespace "$NAMESPACE" --ignore-not-found
