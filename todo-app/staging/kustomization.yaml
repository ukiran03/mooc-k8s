apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

resources:
  - ../base

# Note: Secrets are applied separately via kubectl apply -f secrets.yaml
# The broadcaster-staging-patch.yaml will override these secrets anyway
# Staging uses placeholder secrets (no real Telegram integration)

# Staging-specific patches
patches:
  - path: broadcaster-staging-patch.yaml
    target:
      kind: Deployment
      name: todo-broadcaster-dep

# Staging-specific image tags (updated by CI workflow)
images:
  - name: BACKEND_IMAGE
    newName: ushakiran369/todo-backend
    newTag: "4.6.v0"
  - name: FRONTEND_IMAGE
    newName: ushakiran369/todo-frontend
    newTag: "4.6.v0"
  - name: BROADCASTER_IMAGE
    newName: ushakiran369/todo-broadcaster
    newTag: "4.6.v0"
