apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ukiran03/mooc-k8s.git
    path: ./todo-app
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
