apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-svc
  namespace: project
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # <-- Enables NEG generation for Ingress
spec:
  selector:
    app: todo-frontend
  ports:
    - port: 1234         # This matches our Ingress rule
      targetPort: 3000
