# Service

apiVersion: v1
kind: Service
metadata:
  name: postgres-todo-svc
  namespace: project
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres

---

# Secret

apiVersion: v1
kind: Secret
metadata:
  name: postgres-todo-creds
  namespace: project
type: Opaque
data:
  username: dWtpcmFu
  password: YWJjMTIz
  dbname: cGluZ3Bvbmdz

---

# StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-todo-stset
  namespace: project
spec:
  serviceName: postgres-todo-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-todo-creds
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-todo-creds
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-todo-creds
                  key: dbname
          volumeMounts:
            - name: postgres-data-storage
              mountPath: /var/lib/postgresql
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: postgres-data-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"  # Add this for k3d
        resources:
          requests:
            storage: 100Mi
