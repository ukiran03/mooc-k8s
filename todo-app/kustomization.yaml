apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project

# Cluster-wide or shared resources
resources:
  - todo-app/manifests/app/namespace.yaml
  - todo-app/manifests/app/configmap.yaml
  - todo-app/manifests/app/ingress.yaml
  - todo-app/manifests/app/database/pg-statefulset.yaml
  - todo-app/manifests/app/backend/deployment.yaml
  - todo-app/manifests/app/backend/pvc.yaml
  - todo-app/manifests/app/backend/service.yaml
  - todo-app/manifests/app/frontend/deployment.yaml
  - todo-app/manifests/app/frontend/pvc.yaml
  - todo-app/manifests/app/frontend/service.yaml

images:
  - name: BACKEND_IMAGE
    newName: BACKEND_IMAGE
  - name: FRONTEND_IMAGE
    newName: FRONTEND_IMAGE
