apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project

# Cluster-wide or shared resources
resources:
  - manifests/app/namespace.yaml
  - manifests/app/configmap.yaml
  - manifests/app/ingress.yaml
  - manifests/app/database/pg-statefulset.yaml
  - manifests/app/nats/deployment.yaml
  - manifests/app/backend/deployment.yaml
  - manifests/app/backend/pvc.yaml
  - manifests/app/backend/service.yaml
  - manifests/app/frontend/deployment.yaml
  - manifests/app/frontend/pvc.yaml
  - manifests/app/frontend/service.yaml
  - manifests/app/broadcaster/deployment.yaml
  - manifests/app/cronjob.yaml

images:
  - name: BACKEND_IMAGE
    newName: ushakiran369/todo-backend
    newTag: "4.6.v0"
  - name: FRONTEND_IMAGE
    newName: ushakiran369/todo-frontend
    newTag: "4.6.v0"
  - name: BROADCASTER_IMAGE
    newName: ushakiran369/todo-broadcaster
    newTag: "4.6.v0"
  - name: PG_BACKUP_IMAGE
    newName: ushakiran369/pg-backup-job
    newTag: latest

secretGenerator:
  - name: todo-app-secrets
    envs:
      - .env.secret
